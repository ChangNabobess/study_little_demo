<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <script src="./config.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
    <link rel="stylesheet" href="//at.alicdn.com/t/font_2581644_k6cv3pphp5.css">
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
    <script>
      var width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = '100px'
      // document.body.style.fontSize = '16px'
      /* window.addEventListener('resize',(e)=>{
        console.log(document.body.offsetWidth,screen.width);
        document.documentElement.style.fontSize=(document.body.offsetWidth/screen.width)*100+"px";
        // console.log(document.documentElement.style.fontSize);
      }) */
      function unitPx(val) {
        if (width < 1800) {
          val = val * 0.8
        } else if(width > 1920) {
          val = val * 1.1
        }
        return val + 'px'
      }
      window.onresize = function () {
        width = document.documentElement.clientWidth
      }
    </script>
  </body>
  <!-- <script src="<%= htmlWebpackPlugin.options.title %>"></script> -->
</html>
