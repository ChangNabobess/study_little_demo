<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>.self修饰符</title>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
  </head>
  <body>
    <div id="app">
      <div
        @click.capture="log('11')"
        @click="log('12')"
        @click.self="log('13')"
        style="background-color: aqua; height: 400px; width: 400px"
      >
        <div
          @click.capture="log('21')"
          @click="log('22')"
          @click.self="log('23')"
          style="background-color: #2195de; height: 200px; width: 400px"
        >
          <div
            @click.capture.stop="log('31')"
            @click.self="log('32')"
            style="
              background-color: #9521de;
              height: 100px;
              width: 400px;
              color: #fff;
              line-height: 50px;
              text-align: center;
            "
          >
            <a
              @click.capture="log('41')"
              @click="log('42')"
              href="javascript: console.log('默认事件')"
              style="
                display: block;
                height: 50px;
                width: 4oopx;
                background-color: red;
              "
              >点击a标签</a
            >
          </div>
        </div>
      </div>
    </div>
    <script>
      var app = new Vue({
        el: "#app",
        methods: {
          log(value) {
            console.log(value);
          },
        },
      });
    </script>
  </body>
</html>
